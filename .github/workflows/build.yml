name: Build 8ubah
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build dylib
        run: make clean all FINALPACKAGE=1
      - name: Collect
        run: |
          mkdir -p out
          F=$(find .theos -name "*.dylib" | head -1)
          echo "found: $F"
          cp "$F" out/8ubah.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: 8ubah-dylib
          path: out/8ubah.dylib
